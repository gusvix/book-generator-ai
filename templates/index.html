<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Gerador de Livros com IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8d5c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 560px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #8b6f47 0%, #6d5538 100%);
            color: #fff;
            padding: 32px;
            text-align: center;
        }
        .header h1 { font-size: 1.6rem; margin-bottom: 4px; }
        .header p { font-size: 0.9rem; opacity: 0.85; }
        .form { padding: 32px; }
        .field { margin-bottom: 20px; }
        .field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .field input, .field select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0d5c8;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            transition: border-color 0.2s;
            background: #fdfbf7;
        }
        .field input:focus, .field select:focus {
            outline: none;
            border-color: #8b6f47;
        }
        .row { display: flex; gap: 16px; }
        .row .field { flex: 1; }
        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox-field label { margin: 0; font-size: 0.9rem; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b6f47 0%, #6d5538 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #8b6f47;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #e0d5c8;
            border-top-color: #8b6f47;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result {
            display: none;
            padding: 20px;
            background: #f0f7f0;
            border-radius: 8px;
            margin-top: 20px;
        }
        .result h3 { color: #2d7a2d; margin-bottom: 12px; }
        .result a {
            display: inline-block;
            margin: 4px 8px 4px 0;
            padding: 8px 16px;
            background: #8b6f47;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .result a:hover { opacity: 0.9; }
        .error {
            display: none;
            padding: 16px;
            background: #fdf0f0;
            border-radius: 8px;
            margin-top: 20px;
            color: #c0392b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Gerador de Livros com IA</h1>
            <p>Gere livros educativos automaticamente</p>
        </div>
        <div class="form">
            <div class="field">
                <label for="title">Título do Livro</label>
                <input type="text" id="title" value="Guia Completo Python" placeholder="Digite o título">
            </div>
            <div class="field">
                <label for="author">Autor</label>
                <input type="text" id="author" value="Gerador IA" placeholder="Nome do autor">
            </div>
            <div class="field">
                <label for="topic">Tema</label>
                <input type="text" id="topic" value="Python para Iniciantes" placeholder="Digite o tema">
            </div>
            <div class="row">
                <div class="field">
                    <label for="chapters">Capítulos</label>
                    <input type="number" id="chapters" value="3" min="1" max="10">
                </div>
                <div class="field">
                    <label for="format">Formato</label>
                    <select id="format">
                        <option value="pdf">PDF</option>
                        <option value="epub">EPUB</option>
                        <option value="both">PDF + EPUB</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-field">
                <input type="checkbox" id="local">
                <label for="local">Usar modelo local (Ollama)</label>
            </div>
            <button class="btn" id="generate-btn" onclick="generateBook()">Gerar Livro</button>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Gerando seu livro... Isso pode levar alguns minutos.</p>
            </div>
            <div class="result" id="result"></div>
            <div class="error" id="error"></div>
        </div>
    </div>
    <script>
        async function generateBook() {
            const btn = document.getElementById('generate-btn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: document.getElementById('title').value,
                        author: document.getElementById('author').value,
                        topic: document.getElementById('topic').value,
                        chapters: document.getElementById('chapters').value,
                        format: document.getElementById('format').value,
                        local: document.getElementById('local').checked
                    })
                });
                const data = await response.json();

                if (data.success) {
                    let html = '<h3>✅ Livro gerado com sucesso!</h3>';
                    data.files.forEach(f => {
                        html += `<a href="/download/${f.name}" download>📄 Baixar ${f.format}</a>`;
                    });
                    result.innerHTML = html;
                    result.style.display = 'block';
                } else {
                    error.textContent = data.error || 'Erro ao gerar livro';
                    error.style.display = 'block';
                }
            } catch (e) {
                error.textContent = e.message;
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
